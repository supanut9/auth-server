[workspace]
members = [".", "crates/auth-core", "crates/auth-adapters", "crates/auth-http"]
exclude = ["contract-tests"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
auth-core = { path = "crates/auth-core" }
auth-adapters = { path = "crates/auth-adapters" }
auth-http = { path = "crates/auth-http" }

async-trait = "0.1.92"
secrecy = "0.10.3"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros", "formatting", "parsing", "serde"] }
url = "2.5.9"

axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tokio = { version = "1.54.1", features = ["full"] }
vercel_runtime = { version = "2.4.1", features = ["axum"] }
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "migrate"] }
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"
base64 = "0.23.1"
rand = "0.10.4"
hex = "0.4.3"
rsa = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[package]
name = "auth-server"
version = "0.1.0"
edition.workspace = true
publish = false
autobins = false

[dependencies]
auth-adapters.workspace = true
auth-core.workspace = true
auth-http.workspace = true
axum.workspace = true
dotenvy = "0.15.7"
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
vercel_runtime.workspace = true

[lints]
workspace = true

[[bin]]
name = "auth"
path = "api/auth.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "devseed"
path = "src/bin/devseed.rs"
