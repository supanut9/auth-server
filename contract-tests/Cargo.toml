[package]
name = "auth-contract-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "cookies"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.9"
base64 = "=0.23.1"
sha2 = "=0.11.1"
jsonwebtoken = { version = "=12.0.0", features = ["rust_crypto"] }
uuid = { version = "=1.29.3", features = ["v4"] }
